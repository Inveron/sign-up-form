<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        
        <div id="sidebar">
            
            <div id="overlay">
                BRUH
            </div>
            <div id="credit">
                Photo by someone
            </div>
        </div>
            
        <div id="main-content">
            <div class="info-text">
                <h2 class="header-text">HEY SIGN ME UP BOIIIII</h2>
                <h2 class="header-text">Sign up below for this service you totally need and will never regret signing up for when it floods your inbox with useless garbage</h2>
                <h2 class="header-text">But you know you want to</h2>
                
            </div>

            <div id="form-containter">
                <h2 class="header-text">Sign up or else!</h2>
                <form>
                    <div class="inputs">
                        <label for="first-name">First Name</label>
                        <input type="text" id="last-name" name="first-name">

                        <label for="last-name">Last Name</label>
                        <input type="text" id="last-name" name="last-name">

                        <label for="email">Email</label>
                        <input type="email" id="email" name="email">
                    </div>

                    <div class="inputs">
                        <label for="phone-number">Phone Number</label>
                        <input type="tel" id="phone-number" name="phone-number">

                        <label for="password">Password</label>
                        <input type="password" id="password" name="password">

                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" name="confirm-password">
                    </div>    
                </form>

                
            </div>

            <div class="info-text">
                    <button type="button">Create account</button>
                    <h4 class="normal-text">Already have an account? <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ">Log In</a></h4>
            </div>
        </div>
        
    </body>
</html>
